<!DOCTYPE html>
<html lang="pt-BR">
<head>

<style>
:root{--bg:#eef1f5;--sf:#fff;--tx:#0f1a2b;--mu:#5b6678;--ac:#0d9488;--on:#fff;--ac2:#e3f5f2;--bd:#dde2ea;--bd2:#b4bdca;--hero:#101a30;--wk:#fff;--bk:#0f1a2b;--hl:#f5b301;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1020;--sf:#131c30;--tx:#e9eef7;--mu:#93a0b5;--ac:#2dd4bf;--on:#06201c;--ac2:#10302f;--bd:#25314a;--bd2:#41506b;--hero:#0d1527;--wk:#e9eef7;--bk:#05080f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1020;--sf:#131c30;--tx:#e9eef7;--mu:#93a0b5;--ac:#2dd4bf;--on:#06201c;--ac2:#10302f;--bd:#25314a;--bd2:#41506b;--hero:#0d1527;--wk:#e9eef7;--bk:#05080f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 Inter,"Segoe UI",Roboto,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:640px;margin:0 auto;padding:14px 14px 180px}
.hero{display:flex;align-items:center;gap:18px;background:var(--hero);color:#f2f6fc;border-radius:20px;padding:20px 20px;margin-bottom:14px}
.ring{width:84px;height:84px;flex:none}
.ring circle{fill:none;stroke-width:7}
.r0{stroke:#ffffff22}
.r1{stroke:#2dd4bf;stroke-linecap:round;stroke-dasharray:226.2;stroke-dashoffset:226.2;transition:stroke-dashoffset .5s}
.ring text{fill:#f2f6fc;font:700 18px Inter,system-ui,sans-serif}
.dt{font-size:13px;color:#9fb0c8;text-transform:capitalize}
h1{font:700 30px/1.1 Inter,system-ui,sans-serif;letter-spacing:-.02em;margin:2px 0 4px}
h2{font:600 15px/1.2 Inter,system-ui,sans-serif;margin:0 0 10px}
.pt{font-size:14px;color:#c9d5e6}
.box{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;margin:0 0 16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
label{color:var(--mu);font-size:14px}
input[type=time]{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
button{font:inherit;font-size:14px;cursor:pointer;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:10px;padding:8px 13px;min-height:38px}
button.p{background:var(--ac);border-color:var(--ac);color:var(--on);font-weight:600}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
#sh{accent-color:var(--ac);width:20px;height:20px}
#list{counter-reset:n}
.ex{position:relative;background:var(--sf);border:1px solid var(--bd);border-radius:16px;margin:0 0 10px;padding:14px 16px;transition:background .2s,border-color .2s}
.ex:not(.off){counter-increment:n}
.ex.done{background:var(--ac2);border-color:var(--ac)}
.ex.off{display:none}
.hd{display:flex;gap:14px;align-items:center}
.hd input{appearance:none;-webkit-appearance:none;flex:none;width:30px;height:30px;border:2px solid var(--bd2);border-radius:50%;margin:0;display:grid;place-items:center;cursor:pointer;background:var(--sf)}
.hd input:checked{background:var(--ac);border-color:var(--ac)}
.hd input:checked::after{content:"";width:8px;height:14px;border:solid var(--on);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tt{display:flex;flex-direction:column;min-width:0}
.tt b{font-size:17px;font-weight:650;letter-spacing:-.01em}
.tt b::before{content:counter(n)". ";color:var(--mu);font-weight:500}
.mn{font-size:13px;color:var(--mu)}
.ex.done .tt b{text-decoration:line-through;text-decoration-color:var(--ac)}
.ex ul{margin:10px 0 10px 44px;padding:0 0 0 16px;color:var(--mu);font-size:14.5px}
.ex li{margin:3px 0}
.pl{margin-left:44px;display:flex;gap:6px;flex-wrap:wrap}
.pl button{font-size:13px;padding:6px 10px;min-height:34px;border-radius:999px;color:var(--ac);border-color:var(--bd2)}
.kb{position:fixed;left:0;right:0;bottom:0;background:var(--hero);padding:6px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 -6px 20px #0003}
.kbl{font-size:12px;color:#9fb0c8;padding:0 14px 5px;max-width:640px;margin:0 auto}
.kbs{overflow-x:auto;white-space:nowrap;height:92px;position:relative;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.kbs::-webkit-scrollbar{display:none}
.kbi{position:relative;height:92px;display:inline-block}
.w,.k{position:absolute;top:0;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.w{width:34px;height:92px;background:linear-gradient(#fff,#e9edf3);border:1px solid #7a869a;border-top:0;border-radius:0 0 6px 6px;font-size:10px;color:#516074;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px}
.k{width:22px;height:56px;background:linear-gradient(#26324a,#05080f);border-radius:0 0 4px 4px;z-index:2}
.w.on,.k.on{background:var(--hl)!important}
#msg{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:10px;right:10px;max-width:620px;margin:auto;background:var(--ac);color:var(--on);padding:13px 16px;border-radius:14px;z-index:9;display:none;font-weight:600;box-shadow:0 8px 24px #0004}
.sm{font-size:13px;color:var(--mu);margin:8px 0 0}
.tr{margin:10px 0 0 44px;padding:10px 12px;background:var(--bg);border-radius:12px}
.tl{font-size:13px;font-weight:600;color:var(--mu)}
.ts{display:flex;align-items:center;gap:8px;margin:6px 0 2px}
.pos{font-weight:700;font-size:16px;flex:1;text-align:center}
.ts button{padding:4px 10px;min-height:34px}
.seq{font-size:12.5px;color:var(--mu);margin:2px 0 8px;line-height:1.5}
.ta{display:flex;gap:6px;flex-wrap:wrap}
.ta button{font-size:13px;min-height:36px}
.kbl{display:flex;align-items:center;gap:8px;color:#cfd9ea;font-size:13px;padding:0 14px 6px}
.kbl button{background:#ffffff1c;border:0;color:#fff;min-height:32px;padding:3px 12px;border-radius:8px}
.kbl b{min-width:30px;text-align:center;color:#fff;font-size:17px}
.kbl label{display:flex;gap:5px;align-items:center;color:#cfd9ea;margin-left:auto}
.kbl input{accent-color:#2dd4bf;width:18px;height:18px}
.md{position:fixed;inset:0;background:#0009;z-index:20;display:flex;align-items:center;justify-content:center;padding:14px}
.md[hidden],[hidden]{display:none!important}
.mb{background:var(--sf);color:var(--tx);border-radius:18px;padding:18px;width:100%;max-width:520px;max-height:88vh;overflow:auto}
.mb h2{font-size:18px}.mb label{display:block;margin:10px 0 4px}
.mb input:not([type=checkbox]),.mb textarea,.mb select,#rs{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
#rs{width:auto;flex:1;min-width:0}
.mr{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.fr{border:1px solid var(--bd);border-radius:12px;padding:10px;margin:8px 0}
.fr .row label{margin:0;display:flex;gap:5px;align-items:center}
.g3{display:grid;grid-template-columns:1fr 1fr 60px 60px;gap:8px;margin:8px 0;font-size:12px;color:var(--mu)}
.tb{display:flex;gap:6px;margin:8px 0 0 44px;flex-wrap:wrap}
.tb button{min-height:32px;padding:3px 11px;font-size:13px}
.tmr{margin:10px 0 0 44px;padding:10px 12px;background:var(--bg);border-radius:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tmv{font:700 40px/1 Inter,system-ui,sans-serif;min-width:56px;text-align:center;font-variant-numeric:tabular-nums}
.tml{flex:1;font-size:13px;color:var(--mu);min-width:140px}
.tmr.go{background:var(--ac2);outline:2px solid var(--ac)}
.tmr.go .tmv{color:var(--ac)}
.nav{display:flex;gap:6px;margin:0 0 14px}
.nav button{flex:1;min-height:42px;font-weight:600}
.ab{display:flex;gap:6px;margin:8px 0 0 44px;flex-wrap:wrap}
.ab button{font-size:13px;min-height:32px;padding:3px 11px;border-radius:999px;color:var(--ac)}
.sc{display:flex;gap:8px;border-radius:12px}
.sc button{flex:1;min-height:46px;font-size:18px;font-weight:700}
.pc{border-top:1px solid var(--bd);padding:10px 0}
.pc:first-of-type{border-top:0}
.gt{margin:18px 2px 6px}
.rcd{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:0 0 8px}
.rcd audio,#rc audio{width:100%;margin:8px 0}
.mb textarea[readonly]{margin-top:8px}
.bp{display:flex;align-items:center;gap:8px;margin:2px 0 8px;font-size:14px;flex-wrap:wrap;color:var(--mu)}
.bp b{min-width:30px;text-align:center;font-size:17px;color:var(--tx)}
.bp button{min-height:34px;padding:3px 11px}
.fr .fl,.fr .fpt,.fr .fk{margin-bottom:6px}
.stg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;margin-bottom:12px}
.stg b{display:block;font-size:26px;line-height:1.1}
.stg span{font-size:12px;color:var(--mu)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cd{aspect-ratio:1;border-radius:8px;background:var(--bg);display:grid;place-items:center;font-size:12px;color:var(--mu)}
.cd.l1{background:var(--ac2);color:var(--tx)}
.cd.l2{background:var(--ac2);box-shadow:inset 0 0 0 2px var(--ac);color:var(--tx)}
.cd.l3{background:var(--ac);color:var(--on);font-weight:700}
.cd.td{outline:2px solid var(--hl);outline-offset:1px}
.dl{margin:6px 0 0;padding-left:18px;font-size:14px;color:var(--mu)}
.dh{margin-left:auto;cursor:grab;touch-action:none;padding:4px 8px;color:var(--mu);font-size:22px;line-height:1;user-select:none;-webkit-user-select:none}
.fr{position:relative}
.fr .dh{position:absolute;right:6px;top:8px}
.fr .fk{width:calc(100% - 42px)}
.ex.drag,.fr.drag{position:relative;z-index:8;box-shadow:0 10px 30px #0005;transition:none}
.dtp{box-shadow:0 -3px 0 var(--ac)}
.dtb{box-shadow:0 3px 0 var(--ac)}
.gl{margin:8px 0 0 44px;display:flex;align-items:center;gap:10px;font-size:15px;flex-wrap:wrap}
.gl button{min-height:32px;padding:3px 11px;font-size:13px;border-radius:999px;color:var(--ac)}
</style>
</head>
<body>
<div id="msg"></div>
<main>
<header class="hero"><svg class="ring" viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="36" class="r0"/><circle cx="42" cy="42" r="36" class="r1" id="pb" transform="rotate(-90 42 42)"/><text id="pc" x="42" y="48" text-anchor="middle">0%</text></svg><div><div class="dt" id="dt"></div><h1>Rotina vocal</h1><div class="pt" id="pt"></div></div></header>

<nav class="nav"><button class="p" data-v="1">Treino</button><button data-v="2">Progresso</button><button data-v="3">Gravações</button></nav>
<div id="v1">
<div class="box"><h2>Rotina</h2><div class="row"><select id="rs"></select><button id="ed">Editar rotinas</button><button class="p" id="nx2">+ Exercício</button></div><p class="sm" id="rn"></p><div class="row" id="rm" hidden style="margin-top:8px"><button id="rnew">Nova</button><button id="rren">Renomear</button><button id="rdup">Duplicar</button><button id="rdel">Excluir</button><button id="rexp">Exportar</button><button id="rimp">Importar</button></div></div>

<div class="box"><h2>Lembrete diário</h2>
  <div class="row">
    <label for="tm">Lembrar às</label>
    <input type="time" id="tm" value="19:00">
    <button class="p" id="en">Ativar lembrete</button>
    <button id="ts">Testar</button>
  </div>
  <p class="sm" id="ns">O lembrete só toca com esta página aberta (aba ou app instalado na tela inicial).</p>
</div>

<div id="list"></div>
<p class="sm">O check marca os dias em que você fez cada exercício e fica salvo no histórico (aba Progresso). Use “✔ Resultado” para anotar como foi.</p>
</div><div id="v2" hidden></div><div id="v3" hidden></div>
</main>

<div class="md" id="md" hidden><div class="mb"><div id="mc"></div><div class="mr"><button id="mx">Cancelar</button><button class="p" id="mo">Salvar</button></div></div></div>
<div class="kb" id="kbd"><div class="kbl"><span>Teclado: toque nas teclas</span><button id="sp" style="margin-left:auto">■ Parar</button></div><div class="kbs" id="kbs"><div class="kbi" id="kbi"></div></div></div>

<script>
var S5=[0,2,4,5,7,5,4,2,0],OC=[0,2,4,5,7,9,11,12,11,9,7,5,4,2,0],PT=[0,2,4,7,9,7,4,2,0];
function P(r,p){return p.map(function(x){return r+x})}
var LB={s5:'Escala de 5 notas',oc:'Escala de oitava',pt:'Pentatônica',gl:'Glissando de oitava',si:'Sirene / glissando livre',su:'Nota sustentada',cu:'Padrão livre (semitons)'};
function mk(f){var t=mk0(f);if(f.bpm)t.bpm=f.bpm;return t}
function mk0(f){var K={s5:[S5,7],oc:[OC,12],pt:[PT,9]},l=f.l||LB[f.k],q=K[f.k];
  if(q)return{l:l,t:'n',pat:q[0],lo:f.a,hi:Math.max(f.a,f.z-q[1]),sub:f.sub||2,stac:f.stac,up:f.up};
  if(f.k==='cu'){var cp=f.pat&&f.pat.length?f.pat:[0];return{l:l,t:'n',pat:cp,lo:f.a,hi:Math.max(f.a,f.z-Math.max.apply(null,cp)),sub:f.sub||2,stac:f.stac,up:f.up}}
  if(f.k==='gl')return{l:l,t:'g',lo:f.a,hi:Math.max(f.a,f.z-12),span:12,b:4,r:f.r||1};
  if(f.k==='si')return{l:l,t:'g',lo:f.a,hi:f.a,span:f.z-f.a,b:6,r:f.r||1};
  var p=[];for(var m=f.a;m<=f.z;m++)p.push(m-f.a);return{l:l,t:'n',pat:p,lo:f.a,hi:f.a,ms:(f.sec||5)*1000}}
var SI={k:'si',a:47,z:76,l:'Sirene Si2 → Mi5'};
var EXD=[
{id:'resp',t:'Respiração',m:2,i:['45s em “S”, depois 45s em “Z”, numa nota confortável de fala (em torno de Dó3).'],tr:[{k:'su',a:48,z:48,sec:3,l:'Nota de fala'}],tm:[{l:'“S”',s:45},{l:'“Z”',s:45}],pre:4},
{id:'lab',t:'Vibração de lábios',m:2,i:['Escala de 5 notas (1-2-3-4-5-4-3-2-1): começa em Dó3 (topo Sol3) e sobe meio tom por vez até o topo chegar em Lá4.','3 sirenes de Si2 até o seu limite agudo (por volta de Mi5).'],tr:[{k:'s5',a:48,z:69,sub:2},{k:'si',a:47,z:76,r:3,l:'3 sirenes: Si2 → Mi5'}]},
{id:'can',t:'Canudo',m:3,i:['Sirenes de Si2 a Mi5.','Sustentar 5s: Fá#4, Sol4, Sol#4. Quando ficarem fáceis, acrescente Lá4 e Lá#4.','Um trecho de música do show, logo depois cantando sem canudo.'],tr:[SI,{k:'su',a:66,z:68,sec:5,l:'Sustentar 5s: Fá#4 · Sol4 · Sol#4'},{k:'su',a:69,z:70,sec:5,l:'Quando ficar fácil: Lá4 · Lá#4'}]},
{id:'nha',t:'“Nhá” com ataque direto',m:2,i:['Escala de oitava (1 ao 8 e volta): começa em Dó3 (topo Dó4) e sobe meio tom até o topo chegar em Mi5.'],tr:[{k:'oc',a:48,z:76,sub:2}]},
{id:'gli',t:'“Nhá” em glissando de oitava',m:2,i:['Começa em Dó3 → Dó4 e sobe meio tom até Mi4 → Mi5.'],tr:[{k:'gl',a:48,z:76}]},
{id:'mel',t:'Melismas',m:3,i:['Escala de 5 notas em “á”, metrônomo a 60 bpm, subindo 10 bpm por acerto: começa em Dó3 e sobe até o topo chegar em Sol4.','Mesma escala em staccato (“ha-ha-ha”) e depois ligada.','Pentatônica (Dó-Ré-Mi-Sol-Lá e volta): começa em Dó3 (topo Lá3) e sobe até o topo chegar em Sol4.','Um melisma de música do show, devagar e depois no tempo original.'],tr:[{k:'s5',a:48,z:67,sub:1,up:1,l:'Escala de 5 notas (ligada)'},{k:'s5',a:48,z:67,sub:1,stac:1,up:1,l:'Escala de 5 notas (staccato)'},{k:'pt',a:48,z:67,sub:1}]},
{id:'sus',t:'Sustentação',m:3,i:['“ng-ôôô”, 4-5s cada: Fá#4, Sol4, Sol#4. Depois, quando firme, Lá4 e Lá#4.','Se apertar, feche a vogal (“á” → “ó”).'],tr:[{k:'su',a:66,z:68,sec:5,l:'Fá#4 · Sol4 · Sol#4'},{k:'su',a:69,z:70,sec:5,l:'Lá4 · Lá#4'}]},
{id:'dic',t:'Dicção',m:4,i:['Caneta entre os dentes: 1 min lendo uma letra, depois sem a caneta.','“Pa-ta-ka” rápido: 3 séries de 10.','Trava-línguas: devagar e exagerado, depois acelerando.','Uma frase do show falada com articulação exagerada e depois cantada.'],tr:[],tm:[{l:'Caneta entre os dentes',s:60}],pre:4},
{id:'des',t:'Desaquecimento',m:1,i:['Vibração de lábios ou humming descendo de Sol4 até Dó3, bem suave.'],tr:[{k:'si',a:67,z:48,l:'Descida suave: Sol4 → Dó3'}]}
];
/* Rotina técnica: respiração, staccato, controle de ar, agudos limpos e melismas difíceis */
var TEC=[
{id:'tresp',t:'Respiração e apoio',m:4,i:['Deitado, livro na barriga: 5 respirações pelo nariz, o livro sobe e os ombros ficam parados.','Em pé, mãos nas costelas: ao inspirar elas abrem para os lados; ao soltar o ar, mantenha-as abertas o máximo possível.','Cronômetro: “sss” por 8s, 12s e 16s, com som igual do começo ao fim (sem falhar no final).','“Ss-ss-ss” pulsado: 4 curtos + 1 longo. A barriga dá o pulso, a garganta fica parada.'],tr:[],tm:[{l:'“Sss” constante',s:8},{l:'“Sss” constante',s:12},{l:'“Sss” constante',s:16},{l:'“Ss-ss-ss” pulsado (4 curtos + 1 longo)',s:20}],pre:4},
{id:'tsta',t:'Staccato do zero',m:4,i:['Risada de Papai Noel “ha-ha-ha” falada, com a mão na barriga: sinta ela pular.','“Hu-hu-hu-hu” numa nota, volume baixo.','1-3-5-3-1 em “hu”; quando estiver fácil, tire o “h”: “u-u-u”, começo limpo, sem estalo na garganta.','Arpejo 1-3-5-8 em staccato. Solte a barriga entre as notas: o ar entra sozinho.','Se estalar ou apertar: volte ao “hu” e baixe o volume.'],tr:[{k:'su',a:52,z:52,sec:4,l:'Nota de referência para “hu-hu-hu” (Mi3)'},{k:'cu',pat:[0,4,7,4,0],a:48,z:67,sub:2,stac:1,bpm:70,l:'1-3-5-3-1 em staccato'},{k:'cu',pat:[0,4,7,12,7,4,0],a:48,z:72,sub:2,stac:1,bpm:70,l:'Arpejo 1-3-5-8-5-3-1 em staccato'}]},

function paint(k,pp){var t=TR[k],p=pp==null?cur(k):pp,r=document.querySelector('[data-key="'+k+'"]');if(!r)return;var pos,sq;
  if(t.t==='g'){pos=nm(p)+' → '+nm(p+t.span);sq='Glissando em '+t.b+' tempos'}
  else{pos=nm(p)+(t.pat.length>2?' (topo '+nm(p+Math.max.apply(null,t.pat))+')':'');sq=t.pat.map(function(x){return nm(p+x)}).join(' · ')}

function paintAll(){for(var k in TR)paint(k)}
function play(k,all){
  stopAll();var t=TR[k],p0=cur(k),beat=60000/bpmOf(k),met=metOf(k)&&!t.ms,off=met?beat*2:0,ps=[],i;
  for(var q=p0;q<=(all?t.hi:p0);q++)ps.push(q);
  ps.forEach(function(p){
    var s0=off,tot=0;
    if(t.t==='g'){var ms=t.b*beat,r=t.r||1,n=Math.abs(t.span);tot=ms*r;
      for(var j=0;j<r;j++)(function(o){tone(p,ms,p+t.span,o/1000);
        for(var i=0;i<=n;i++)(function(i){timers.push(setTimeout(function(){lit(p+(t.span<0?-i:i),ms/n)},o+ms*i/n))})(i)})(s0+j*ms)}
    else{var d=t.ms||beat/t.sub;tot=d*t.pat.length;
      t.pat.forEach(function(x,i){var m=p+x;tone(m,d,null,(s0+i*d)/1000,t.stac?.35:.93);timers.push(setTimeout(function(){lit(m,d*.9)},s0+i*d))})}
    timers.push(setTimeout(function(){paint(k,p);scrollTo(p)},s0));
    off+=met?Math.ceil((tot+1)/beat)*beat:tot+(t.ms?600:300);
  });
  if(met){var nb=Math.ceil(off/beat);for(i=0;i<nb;i++)click(i*beat/1000,i%4===0)}
  timers.push(setTimeout(function(){paint(k)},off));

}

/* Gravações (IndexedDB) */
var DB=null,REC=null,RT=null,URLS={},SEL={a:null,b:null},RL=[];
function idb(){return new Promise(function(res,rej){if(DB)return res(DB);var r=indexedDB.open('vox',1);r.onupgradeneeded=function(){r.result.createObjectStore('rec',{keyPath:'id'})};r.onsuccess=function(){DB=r.result;res(DB)};r.onerror=rej})}
function dbx(m,a){return idb().then(function(d){return new Promise(function(res,rej){var o=d.transaction('rec',m==='getAll'?'readonly':'readwrite').objectStore('rec')[m](a);o.onsuccess=function(){res(o.result)};o.onerror=rej})})}
function fmt(n){return Math.floor(n/60)+':'+('0'+n%60).slice(-2)}
function fd(t){return new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})}
function recToggle(){if(REC){REC.mr.stop();return}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(sm){var ch=[],mt=['audio/webm;codecs=opus','audio/mp4','audio/webm'].filter(function(t){return window.MediaRecorder&&MediaRecorder.isTypeSupported(t)})[0],mr=new MediaRecorder(sm,mt?{mimeType:mt}:{}),t0=Date.now();
    mr.ondataavailable=function(e){if(e.data.size)ch.push(e.data)};
    mr.onstop=function(){sm.getTracks().forEach(function(t){t.stop()});clearInterval(RT);REC=null;var b=$('rb');if(b)b.textContent='● Gravar';var r=$('rt');if(r)r.textContent='';saveRec(new Blob(ch,{type:mr.mimeType||mt||'audio/webm'}),Math.round((Date.now()-t0)/1000))};
    mr.start();REC={mr:mr};$('rb').textContent='■ Parar';RT=setInterval(function(){var r=$('rt');if(r)r.textContent=fmt(Math.round((Date.now()-t0)/1000))},500)
  }).catch(function(){banner('Não consegui acessar o microfone. Permita o acesso nas configurações do aparelho.')})}
function saveRec(blob,dur){modal('<h2>Salvar gravação</h2><p class="sm">'+fmt(dur)+' · '+fd(Date.now())+'</p><label>Música / trecho</label><input id="rtt" placeholder="Ex.: Refrão da música X" list="rtl"><datalist id="rtl">'+Object.keys(RL.reduce(function(o,x){o[x.title]=1;return o},{})).map(function(t){return'<option value="'+esc(t)+'">'}).join('')+'</datalist><label>Observação (opcional)</label><textarea id="rtn" rows="2"></textarea>',function(){
  var t=$('rtt').value.trim();if(!t){$('rtt').focus();return false}
  dbx('put',{id:Date.now(),t:Date.now(),title:t,note:$('rtn').value.trim(),type:blob.type,dur:dur,blob:blob}).then(function(){banner('Gravação salva ✓');renderRec()}).catch(function(){banner('Não foi possível salvar o áudio.')})})}
function renderRec(){$('v3').innerHTML='<div class="box"><h2>Gravações</h2><p class="sm">Grave você cantando uma música, salve com a data e compare com gravações antigas.</p><div class="row"><button class="p" id="rb">● Gravar</button><b id="rt"></b></div></div><div id="rl"></div><div id="rc"></div>';
  $('rb').onclick=recToggle;
  dbx('getAll').then(function(l){RL=l.sort(function(a,b){return a.title<b.title?-1:a.title>b.title?1:b.t-a.t});
    var h='',last=null;RL.forEach(function(x){if(!URLS[x.id])URLS[x.id]=URL.createObjectURL(x.blob);
      if(x.title!==last){h+='<h2 class="gt">'+esc(x.title)+'</h2>';last=x.title}
      h+='<div class="rcd" data-id="'+x.id+'"><div><b>'+fd(x.t)+'</b> · '+fmt(x.dur)+(x.note?'<div class="sm">'+esc(x.note)+'</div>':'')+'</div><audio controls preload="none" src="'+URLS[x.id]+'"></audio><div class="row"><button data-c="a"'+(SEL.a===x.id?' class="p"':'')+'>A</button><button data-c="b"'+(SEL.b===x.id?' class="p"':'')+'>B</button><button data-c="ren">Renomear</button><button data-c="del">Excluir</button></div></div>'});
    $('rl').innerHTML=h||'<p class="sm">Nenhuma gravação ainda.</p>';cmpShow()}).catch(function(){$('rl').innerHTML='<p class="sm">Armazenamento de áudio indisponível neste aparelho.</p>'})}
function recById(id){return RL.filter(function(x){return x.id===id})[0]}
function cmpShow(){var A=recById(SEL.a),B=recById(SEL.b),c=$('rc');if(!A||!B){c.innerHTML=SEL.a||SEL.b?'<p class="sm">Escolha também a outra gravação (A e B) para comparar.</p>':'';return}
  c.innerHTML='<div class="box"><h2>Comparar A × B</h2><p class="sm"><b>A:</b> '+esc(A.title)+' · '+fd(A.t)+'<br><b>B:</b> '+esc(B.title)+' · '+fd(B.t)+'</p><audio id="ca" controls src="'+URLS[A.id]+'"></audio><audio id="cb" controls src="'+URLS[B.id]+'"></audio><div class="row" style="margin-top:8px"><button class="p" id="pa">▶ A</button><button class="p" id="pb2">▶ B</button><button id="sw">⇄ Alternar no mesmo ponto</button><button id="ps">■</button></div></div>';
  var a=$('ca'),b=$('cb');$('pa').onclick=function(){b.pause();a.play()};$('pb2').onclick=function(){a.pause();b.play()};
  $('sw').onclick=function(){var x=a.paused?b:a,y=x===a?b:a;y.currentTime=x.currentTime;x.pause();y.play()};$('ps').onclick=function(){a.pause();b.pause()}}
document.addEventListener('click',function(e){var b=e.target.closest('#rl button[data-c]');if(!b)return;var id=+b.closest('.rcd').dataset.id,c=b.dataset.c,x=recById(id);
  if(c==='a'||c==='b'){SEL[c]=SEL[c]===id?null:id;renderRec()}
  else if(c==='ren')modal('<h2>Renomear</h2><label>Música / trecho</label><input id="rtt" value="'+esc(x.title)+'"><label>Observação</label><textarea id="rtn" rows="2">'+esc(x.note||'')+'</textarea>',function(){var t=$('rtt').value.trim();if(!t)return false;x.title=t;x.note=$('rtn').value.trim();dbx('put',x).then(renderRec)});
  else if(c==='del')ask('Excluir esta gravação?',function(){dbx('delete',id).then(function(){if(SEL.a===id)SEL.a=null;if(SEL.b===id)SEL.b=null;renderRec()})})});
function view(n){stopAll();['v1','v2','v3'].forEach(function(v,i){$(v).hidden=i+1!==n});document.querySelectorAll('.nav button').forEach(function(b,i){b.classList.toggle('p',i+1===n)});$('kbd').hidden=n!==1;if(n===2)renderProg();if(n===3)renderRec();window.scrollTo(0,0)}
document.querySelector('.nav').onclick=function(e){var b=e.target.closest('button');if(b)view(+b.dataset.v)};
var DR=null;
function drEnd(go){if(!DR)return;var d=DR;DR=null;d.sec.classList.remove('drag');d.sec.style.transform='';d.others.forEach(function(c){c.classList.remove('dtp','dtb')});
  if(!go)return;var to=d.to;
  if(d.kind==='ex'){var r=R();if(to!==d.from){r.ex.splice(to,0,r.ex.splice(d.from,1)[0]);save()}render()}
  else{if(to>=d.others.length)d.sec.parentNode.appendChild(d.sec);else d.sec.parentNode.insertBefore(d.sec,d.others[to])}}
document.addEventListener('pointerdown',function(e){var h=e.target.closest('.dh');if(!h)return;var sec=h.closest('.ex,.fr');if(!sec)return;e.preventDefault();
  var kind=sec.classList.contains('ex')?'ex':'fr',sibs=[].filter.call(sec.parentNode.children,function(c){return c.classList.contains(kind)}),i=sibs.indexOf(sec);
  DR={sec:sec,kind:kind,from:i,to:i,y:e.clientY,sy:window.scrollY,others:sibs.filter(function(c){return c!==sec})};sec.classList.add('drag');try{h.setPointerCapture(e.pointerId)}catch(x){}});
document.addEventListener('pointermove',function(e){if(!DR)return;
  if(DR.kind==='ex'){if(e.clientY<90)window.scrollBy(0,-14);else if(e.clientY>window.innerHeight-220)window.scrollBy(0,14)}
  DR.sec.style.transform='translateY('+(e.clientY-DR.y+(DR.kind==='ex'?window.scrollY-DR.sy:0))+'px)';
  var n=0;DR.others.forEach(function(c){var b=c.getBoundingClientRect();if(b.top+b.height/2<e.clientY)n++});DR.to=n;
  DR.others.forEach(function(c,i){c.classList.toggle('dtp',i===n);c.classList.toggle('dtb',n>=DR.others.length&&i===DR.others.length-1)})});
document.addEventListener('pointerup',function(){drEnd(1)});
document.addEventListener('pointercancel',function(){drEnd(0)});
$('nx2').onclick=function(){openEx(-1)};
status();render();setTimeout(sched,500);
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!window.Capacitor)addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
</script>
</body>
</html>
